<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>청년대표</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020d0c;font-family:Arial,'Noto Sans KR',sans-serif;color:#f5fffb;user-select:none;touch-action:manipulation}.s{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 80%,#31d8ad29,transparent 35%),linear-gradient(#061714,#020b0a);transition:1s}.s.gold{background:radial-gradient(circle at 50% 75%,#ffb52e38,transparent 38%),linear-gradient(#181003,#070501)}.c{position:relative;width:94vw;height:96vh;max-width:720px;max-height:1220px;border:1px solid #78f6d04d;border-radius:30px;overflow:hidden;background:#061b18ee}.gold .c{border-color:#ffd66b66;background:#171104f2}.h{position:absolute;top:4%;left:4%;right:4%;text-align:center;z-index:5}.k{font-size:clamp(12px,2.5vw,18px);letter-spacing:.08em;opacity:.5}.r{margin-top:12px;font-size:clamp(25px,5.2vw,42px);font-weight:900}.o{margin-top:6px;font-size:clamp(14px,3.1vw,22px);opacity:.58}.p{position:absolute;inset:19% 5% 27%;transition:.7s}.gold .p{opacity:0;filter:blur(10px)}.p i{position:absolute;width:43%;font-style:normal;font-size:clamp(11px,2.3vw,16px);line-height:1.35;color:#b0ffe6c7;text-shadow:0 0 12px #31d8ad55;animation:f 4s ease-in-out infinite}.p i:before{content:'✦ ';color:#78f6d0}.p i:nth-child(1){left:1%;top:2%}.p i:nth-child(2){right:1%;top:2%}.p i:nth-child(3){left:1%;top:29%}.p i:nth-child(4){right:1%;top:29%}.p i:nth-child(5){left:1%;top:58%}.p i:nth-child(6){right:1%;top:58%}.p i:nth-child(7){left:7%;bottom:0}.p i:nth-child(8){right:7%;bottom:0}@keyframes f{50%{transform:translateY(-6px);opacity:.65}}.mid{position:absolute;inset:29% 5% 27%;display:flex;align-items:center;justify-content:center;text-align:center;z-index:4}.hero{font-size:clamp(48px,12vw,96px);font-weight:950;letter-spacing:-.05em;line-height:1.08;color:#bfffee;opacity:0;transform:scale(.75);filter:blur(12px)}.hero.show{animation:show 1.1s forwards}@keyframes show{70%{opacity:1;transform:scale(1.05);filter:blur(0)}100%{opacity:1;transform:scale(1);filter:blur(0)}}.gold .hero{color:#fff2c7;text-shadow:0 0 22px #ffd66b88,0 0 55px #ffb52e55}.touch{position:absolute;z-index:9;left:50%;bottom:8%;transform:translateX(-50%);width:140px;height:140px;border-radius:50%;cursor:pointer}.ring,.core{position:absolute;border-radius:50%}.ring{inset:0;border:2px solid #78f6d0;box-shadow:0 0 30px #78f6d0aa;animation:pulse 1.5s infinite}.core{inset:38px;background:radial-gradient(circle at 35% 30%,#e2fff7,#49ddb8 42%,#31d8ad33);box-shadow:0 0 35px #78f6d0}.gold .ring{border-color:#ffd66b;box-shadow:0 0 38px #ffd66bbb}.gold .core{background:radial-gradient(circle at 35% 30%,#fff7d7,#ffd66b 42%,#ffb52e33);box-shadow:0 0 42px #ffd66b}@keyframes pulse{50%{transform:scale(1.1);box-shadow:0 0 55px #78f6d0}}.tt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#063b31;font-weight:900;font-size:14px}.gold .tt{color:#5b3500}.cap{position:absolute;top:150px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;opacity:.65}.stars{position:absolute;inset:0;pointer-events:none;opacity:0}.gold .stars{opacity:1}.stars b{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd66b;box-shadow:0 0 15px #ffd66b;animation:tw 1s infinite alternate}.stars b:nth-child(1){left:12%;top:22%}.stars b:nth-child(2){left:25%;top:63%}.stars b:nth-child(3){left:48%;top:20%}.stars b:nth-child(4){left:68%;top:68%}.stars b:nth-child(5){left:86%;top:30%}.stars b:nth-child(6){left:78%;top:52%}@keyframes tw{to{transform:scale(2);opacity:.3}}</style></head><body><div id="s" class="s"><div class="c"><div class="h"><div class="k">100개의 다짐 · 4개의 약속 · 하나의 내일</div><div class="r">청년대표</div><div class="o">대한민국 청년 금융교육 프로젝트</div></div><div class="p"><i>더 나은 세상을 만들겠습니다</i><i>청년의 가능성으로 미래를 밝히겠습니다</i><i>함께라서 더 강해지겠습니다</i><i>변화를 만드는 주인공이 되겠습니다</i><i>오늘의 다짐을 내일로 이어가겠습니다</i><i>우리의 내일을 희망으로 밝히겠습니다</i><i>서로의 성장을 응원하겠습니다</i><i>배운 것을 실천하겠습니다</i></div><div class="mid"><div id="hero" class="hero"></div></div><div class="stars"><b></b><b></b><b></b><b></b><b></b><b></b></div><div id="touch" class="touch"><div class="ring"></div><div class="core"></div><div class="tt">TOUCH</div><div id="cap" class="cap">청년의 다짐을 밝혀주세요</div></div></div></div><script>const a='하나의 내일',b='만들겠습니다.',s=document.getElementById('s'),h=document.getElementById('hero'),cap=document.getElementById('cap');let n=0,lock=0;function go(){if(lock)return;lock=1;h.classList.remove('show');if(n===0){n=1;h.textContent=a;cap.textContent='한 번 더 터치해주세요'}else{n=2;s.classList.add('gold');h.textContent=b;cap.textContent='최종 메시지 완성'}void h.offsetWidth;h.classList.add('show');setTimeout(()=>lock=0,1100)}document.getElementById('touch').addEventListener('pointerup',e=>{e.stopPropagation();go()});document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')go();if(e.key==='r'||e.key==='R')location.reload()});</script></body></html>
