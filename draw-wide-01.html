on ri(m){if(window.crypto&&crypto.getRandomValues){let a=new Uint32Array(1),lim=0x100000000-(0x100000000%m);do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%m}return Math.floor(Math.random()*m)}function choice(a){return a[ri(a.length)]}function ready(){c.innerHTML='<div class="k">BETTER TOMORROW</div><h1>청년의 더 나은 내일을<br>시작해주세요</h1><div class="sub">박성민 청년특보님의 한 번의 터치로 첫 번째 행운의 주인공을 선정합니다.</div><button class="btn" onclick="start()">청년특보님, 터치해주세요<small>TOUCH TO START</small></button>'}function start(){if(running)return;running=true;if(!started){localStorage.removeItem(KEY);started=true}let pool=[...N];phase('CHANGE','변화의 시작',()=>phase('GROWTH','성장의 가능성',()=>phase('TOMORROW','더 나은 내일',()=>scan(pool))))}function phase(w,k,next){c.innerHTML='<div class="word">'+w+'</div><div class="ko">'+k+'</div>';setTimeout(next,1050)}function scan(pool){let n=0,total=34;function tick(){c.innerHTML='<div class="label">FINDING TODAY\'S BETTER TOMORROW</div><div class="slot">'+choice(pool)+'</div>';n++;if(n<total)setTimeout(tick,n>24?150:75);else{let w=choice(pool);save(w);setTimeout(()=>win(w),350)}}tick()}function win(w){c.innerHTML='<div class="winnerLabel">TODAY\'S BETTER TOMORROW</div><div class="winner">'+w+'</div><div class="congrats">축하합니다!</div><div class="tag">변화와 성장, 그리고 더 나은 내일</div>';let b=document.getElementById('cf'),cs=['#00b7a8','#7ce7dc','#ffd166','#fff','#4d96ff'];for(let i=0;i<110;i++){let x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.background=cs[i%cs.length];x.style.animationDelay=Math.random()*.7+'s';b.appendChild(x)}running=false}ready();</script></body></html>
