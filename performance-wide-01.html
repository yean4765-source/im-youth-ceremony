<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>제1회 대한민국 청년 금융교육 프로젝트</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03110f;font-family:Arial,'Noto Sans KR','Malgun Gothic',sans-serif;color:#fff}.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 60%,#20d6ae28,transparent 34%),linear-gradient(135deg,#071d19,#020b0a)}.grid{position:absolute;inset:0;opacity:.16;background-image:linear-gradient(#65f6dc12 1px,transparent 1px),linear-gradient(90deg,#65f6dc12 1px,transparent 1px);background-size:56px 56px}.kicker{position:absolute;top:7.5%;left:0;right:0;text-align:center;font-size:clamp(18px,1.75vw,32px);font-weight:950;letter-spacing:-.03em;color:#dffff7;text-shadow:0 0 18px #59e6ca55}.row{position:relative;z-index:3;width:94%;display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vw}.card{position:relative;min-width:0;height:38vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2vw;border-radius:2vw;border:1px solid #77f2da55;background:linear-gradient(180deg,#0c2924bb,#061815cc);box-shadow:inset 0 0 55px #54e8ca10,0 0 28px #1ed1ad12;overflow:hidden;animation:rise 1.15s cubic-bezier(.2,.8,.2,1) both}.card:nth-child(2){animation-delay:.18s}.card:nth-child(3){animation-delay:.36s}.card:nth-child(4){animation-delay:.54s}.card:before{content:'';position:absolute;inset:-30% -70%;background:linear-gradient(110deg,transparent 38%,#b8fff15c 48%,#effffba6 50%,#7ef2dc50 52%,transparent 62%);transform:translateX(-55%) rotate(2deg);animation:sweep 3.8s ease-in-out infinite}.card:after{content:'✦';position:absolute;right:10%;top:13%;font-size:clamp(16px,1.4vw,27px);color:#bffff1;text-shadow:0 0 16px #65f4da;animation:starPulse 1.5s ease-in-out infinite alternate}.text{position:relative;z-index:2;font-weight:950;line-height:1.08;letter-spacing:-.07em;color:#eafff9;text-shadow:0 0 12px #fff7,0 0 32px #54e6c888;font-size:clamp(34px,4vw,76px);white-space:normal;word-break:keep-all}.card:nth-child(2) .text{font-size:clamp(30px,3.6vw,68px)}.card:nth-child(3) .text{font-size:clamp(34px,4vw,76px)}.card:nth-child(4) .text{font-size:clamp(34px,4vw,76px)}.spark{position:absolute;width:7px;height:7px;border-radius:2px;background:#a6ffed;box-shadow:0 0 18px 5px #54e8ca;transform:rotate(45deg);animation:tw 1s ease-in-out infinite alternate}.s1{left:7%;top:24%}.s2{left:18%;bottom:18%;animation-delay:.3s}.s3{left:45%;top:17%;animation-delay:.6s}.s4{right:13%;top:29%;animation-delay:.15s}.s5{right:7%;bottom:19%;animation-delay:.75s}.footer{position:absolute;bottom:8%;left:0;right:0;text-align:center;font-size:clamp(14px,1.35vw,23px);font-weight:800;letter-spacing:.08em;color:#a8d8cf}@keyframes rise{from{opacity:0;transform:translateY(45px) scale(.92);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}@keyframes sweep{0%,18%{transform:translateX(-60%) rotate(2deg);opacity:0}30%{opacity:.75}52%{transform:translateX(58%) rotate(2deg);opacity:.9}70%,100%{transform:translateX(65%) rotate(2deg);opacity:0}}@keyframes starPulse{to{transform:scale(1.35) rotate(12deg);opacity:.45}}@keyframes tw{to{transform:rotate(45deg) scale(1.8);opacity:.25}}@media(max-aspect-ratio:1.3/1){.row{gap:1vw}.card{height:32vh;padding:1.2vw}.text{font-size:clamp(25px,3.3vw,54px)}}</style></head><body><div class="stage"><div class="grid"></div><div class="kicker">제1회 대한민국 청년 금융교육 프로젝트</div><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i><div class="row"><div class="card"><div class="text">청년과 함께</div></div><div class="card"><div class="text">100개의 다짐</div></div><div class="card"><div class="text">4개의 약속</div></div><div class="card"><div class="text">하나의 내일</div></div></div><div class="footer">대한민국 청년 금융교육 프로젝트</div></div></body></html>
