<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>제1회 대한민국 청년 금융교육 프로젝트</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03110f;font-family:Arial,'Noto Sans KR','Malgun Gothic',sans-serif;color:#fff}.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 66%,#20d6ae26,transparent 38%),linear-gradient(135deg,#071d19,#020b0a)}.grid{position:absolute;inset:0;opacity:.13;background-image:linear-gradient(#65f6dc10 1px,transparent 1px),linear-gradient(90deg,#65f6dc10 1px,transparent 1px);background-size:56px 56px}.kicker{position:absolute;top:7.5%;left:0;right:0;text-align:center;font-size:clamp(18px,1.75vw,32px);font-weight:950;letter-spacing:-.03em;color:#dffff7;text-shadow:0 0 18px #59e6ca55;z-index:5}.row{position:relative;z-index:3;width:94%;display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vw}.card{position:relative;min-width:0;height:38vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2vw;border-radius:2vw;border:1px solid #77f2da66;background:linear-gradient(180deg,#0c2924c2,#061815da);box-shadow:inset 0 0 55px #54e8ca0f,0 0 28px #1ed1ad12;overflow:hidden;animation:rise 1.15s cubic-bezier(.2,.8,.2,1) both}.card:nth-child(2){animation-delay:.18s}.card:nth-child(3){animation-delay:.36s}.card:nth-child(4){animation-delay:.54s}.text{position:relative;z-index:2;font-weight:950;line-height:1.08;letter-spacing:-.07em;color:#eafff9;text-shadow:0 0 12px #fff7,0 0 32px #54e6c888;font-size:clamp(34px,4vw,76px);white-space:normal;word-break:keep-all}.card:nth-child(2) .text{font-size:clamp(30px,3.6vw,68px)}.particles{position:absolute;inset:0;z-index:2;pointer-events:none}.particles i{position:absolute;bottom:-8vh;width:7px;height:7px;border-radius:50%;background:#8fffe9;box-shadow:0 0 14px 4px #43e4c3aa;opacity:0;animation:floatUp linear infinite}.particles i:nth-child(3n){width:4px;height:4px;filter:blur(.2px)}.particles i:nth-child(4n){width:10px;height:10px;opacity:.45}.footer{position:absolute;bottom:8%;left:0;right:0;text-align:center;font-size:clamp(14px,1.35vw,23px);font-weight:800;letter-spacing:.08em;color:#a8d8cf;z-index:4}@keyframes rise{from{opacity:0;transform:translateY(45px) scale(.92);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}@keyframes floatUp{0%{transform:translate(0,0) scale(.5);opacity:0}12%{opacity:.75}55%{transform:translate(var(--drift),-52vh) scale(1.1);opacity:.85}100%{transform:translate(calc(var(--drift)*1.5),-110vh) scale(.25);opacity:0}}@media(max-aspect-ratio:1.3/1){.row{gap:1vw}.card{height:32vh;padding:1.2vw}.text{font-size:clamp(25px,3.3vw,54px)}}</style></head><body><div class="stage"><div class="grid"></div><div class="kicker">제1회 대한민국 청년 금융교육 프로젝트</div><div class="particles">"+""+"</div><div class="row"><div class="card"><div class="text">청년과 함께</div></div><div class="card"><div class="text">100개의 다짐</div></div><div class="card"><div class="text">4개의 약속</div></div><div class="card"><div class="text">하나의 내일</div></div></div><div class="footer">대한민국 청년 금융교육 프로젝트</div></div><script>const p=document.querySelector('.particles');for(let i=0;i<54;i++){const e=document.createElement('i');e.style.left=(3+Math.random()*94)+'%';e.style.animationDuration=(5+Math.random()*5)+'s';e.style.animationDelay=(-Math.random()*8)+'s';e.style.setProperty('--drift',(Math.random()*120-60)+'px');p.appendChild(e)}</script></body></html>
