<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>지원장 세레머니</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020d0c;font-family:Arial,'Noto Sans KR',sans-serif;color:#f5fffb;user-select:none;touch-action:manipulation}.s{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 80%,#31d8ad29,transparent 35%),linear-gradient(#061714,#020b0a);transition:1s}.s.gold{background:radial-gradient(circle at 50% 52%,#fff1a933,transparent 20%),radial-gradient(circle at 50% 75%,#ffb52e55,transparent 45%),linear-gradient(#211703,#080501)}.c{position:relative;width:94vw;height:96vh;max-width:720px;max-height:1220px;border:1px solid #78f6d04d;border-radius:30px;overflow:hidden;background:#061b18ee}.gold .c{border-color:#ffe28a99;background:#171104f2;box-shadow:inset 0 0 100px #ffd66b22,0 0 70px #ffb52e33}.h{position:absolute;top:4%;left:4%;right:4%;text-align:center;z-index:5}.k{font-size:clamp(12px,2.5vw,18px);letter-spacing:.08em;opacity:.5}.r{margin-top:12px;font-size:clamp(25px,5.2vw,42px);font-weight:900}.o{margin-top:6px;font-size:clamp(14px,3.1vw,22px);opacity:.58}.p{position:absolute;inset:19% 5% 27%;transition:.7s}.gold .p{opacity:0;filter:blur(10px)}.p i{position:absolute;width:43%;font-style:normal;font-size:clamp(11px,2.3vw,16px);line-height:1.35;color:#b0ffe6c7}.p i:before{content:'✦ ';color:#78f6d0}.p i:nth-child(1){left:1%;top:2%}.p i:nth-child(2){right:1%;top:2%}.p i:nth-child(3){left:1%;top:29%}.p i:nth-child(4){right:1%;top:29%}.p i:nth-child(5){left:1%;top:58%}.p i:nth-child(6){right:1%;top:58%}.p i:nth-child(7){left:7%;bottom:0}.p i:nth-child(8){right:7%;bottom:0}.mid{position:absolute;inset:27% 3% 25%;display:flex;align-items:center;justify-content:center;text-align:center;z-index:4}.hero{font-size:clamp(50px,12vw,96px);font-weight:950;letter-spacing:-.05em;line-height:1.06;color:#bfffee;opacity:0;transform:scale(.75);filter:blur(12px)}.hero.show{animation:show 1.1s forwards}@keyframes show{70%{opacity:1;transform:scale(1.05);filter:blur(0)}100%{opacity:1;transform:scale(1);filter:blur(0)}}.gold .hero{font-size:clamp(64px,16vw,132px);color:#fff8d8;text-shadow:0 0 12px #fff,0 0 30px #ffd66bcc,0 0 70px #ffb52e99}.touch{position:absolute;z-index:9;left:50%;bottom:8%;transform:translateX(-50%);width:140px;height:140px;border-radius:50%}.ring,.core{position:absolute;border-radius:50%}.ring{inset:0;border:2px solid #78f6d0;box-shadow:0 0 30px #78f6d0aa;animation:pulse 1.5s infinite}.core{inset:38px;background:radial-gradient(circle at 35% 30%,#e2fff7,#49ddb8 42%,#31d8ad33);box-shadow:0 0 35px #78f6d0}.gold .ring{border-color:#ffd66b;box-shadow:0 0 50px #ffd66bcc}.gold .core{background:radial-gradient(circle at 35% 30%,#fff,#ffe89b 35%,#ffb52e44);box-shadow:0 0 60px #ffd66b}@keyframes pulse{50%{transform:scale(1.1)}}.tt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#063b31;font-weight:900;font-size:14px}.cap{position:absolute;top:150px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;opacity:.65}.stars{position:absolute;inset:0;pointer-events:none;opacity:0}.gold .stars{opacity:1}.stars b{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff2b0;box-shadow:0 0 18px 5px #ffd66b;animation:tw .8s infinite alternate}.stars b:nth-child(1){left:10%;top:20%}.stars b:nth-child(2){left:22%;top:65%}.stars b:nth-child(3){left:42%;top:18%}.stars b:nth-child(4){left:62%;top:72%}.stars b:nth-child(5){left:86%;top:26%}.stars b:nth-child(6){left:78%;top:52%}.stars b:nth-child(7){left:52%;top:38%}.stars b:nth-child(8){left:31%;top:49%}@keyframes tw{to{transform:scale(2.4);opacity:.25}}</style></head><body><div id="s" class="s"><div class="c"><div class="h"><div class="k">100개의 다짐 · 4개의 약속 · 하나의 내일</div><div class="r">이현석 지원장</div><div class="o">금융감독원 대구경북지원</div></div><div class="p"><i>경제를 이해하는 힘을 키우겠습니다</i><i>현명한 금융습관을 만들겠습니다</i><i>나만의 목표를 세우고 이루겠습니다</i><i>미래를 준비하는 청년이 되겠습니다</i><i>기회를 만들고 가치를 더하겠습니다</i><i>오늘보다 더 나은 내일을 만들겠습니다</i><i>꾸준히 배우겠습니다</i><i>내 선택에 책임지는 사람이 되겠습니다</i></div><div class="mid"><div id="hero" class="hero">100개의 다짐</div></div><div class="stars"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div><div id="touch" class="touch"><div class="ring"></div><div class="core"></div><div class="tt">TOUCH</div><div class="cap">터치해주세요</div></div></div></div><script>const s=document.getElementById('s'),h=document.getElementById('hero');h.classList.add('show');let done=0;function go(){if(done)return;done=1;s.classList.add('gold');h.classList.remove('show');h.textContent='더 나은 내일을';void h.offsetWidth;h.classList.add('show')}document.getElementById('touch').addEventListener('pointerup',e=>{e.stopPropagation();go()});</script></body></html>
