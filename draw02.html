<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUCKY SPARK · 이현석 지원장</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#041413;font-family:Arial,'Noto Sans KR','Malgun Gothic',sans-serif;color:#fff;user-select:none;touch-action:manipulation}.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,#0fd9b52b 0,transparent 26%),radial-gradient(circle at 50% 90%,#0dc3a520 0,transparent 34%),linear-gradient(180deg,#08211e 0%,#03100f 100%)}.grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(#63ffe61a 1px,transparent 1px),linear-gradient(90deg,#63ffe61a 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 75%,transparent)}.top{position:absolute;top:5.5%;left:0;right:0;text-align:center;z-index:5}.kicker{font-size:clamp(12px,1.5vw,19px);font-weight:900;letter-spacing:.24em;color:#71f6df}.title{margin-top:10px;font-size:clamp(27px,3.8vw,54px);font-weight:950;letter-spacing:-.05em}.sub{margin-top:8px;font-size:clamp(13px,1.7vw,22px);color:#b9d9d4}.core{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:min(63vw,680px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center}.halo,.halo2,.halo3{position:absolute;border-radius:50%;inset:0;border:1px solid #75f6df66;box-shadow:0 0 40px #23dab044}.halo{animation:spin 9s linear infinite}.halo2{inset:9%;border-style:dashed;animation:spin 6s linear reverse infinite}.halo3{inset:21%;border-color:#cafff566;box-shadow:inset 0 0 55px #36dcb529}.halo:before,.halo:after,.halo2:before,.halo2:after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#9affec;box-shadow:0 0 20px 8px #44e8c4}.halo:before{left:14%;top:13%}.halo:after{right:7%;bottom:27%}.halo2:before{right:19%;top:4%}.halo2:after{left:4%;bottom:31%}@keyframes spin{to{transform:rotate(360deg)}}.countWrap{position:relative;z-index:4;text-align:center}.count{font-size:clamp(100px,20vw,260px);font-weight:950;line-height:.82;letter-spacing:-.08em;color:#eafffa;text-shadow:0 0 14px #fff,0 0 35px #69f7df,0 0 90px #13d6b2;transition:.35s}.label{margin-top:24px;font-size:clamp(18px,2.2vw,30px);font-weight:900;letter-spacing:.12em;color:#83f3df}.mini{margin-top:10px;font-size:clamp(12px,1.5vw,18px);color:#a9c9c4}.particles{position:absolute;inset:0;z-index:2}.dot{position:absolute;border-radius:50%;background:#83ffe8;box-shadow:0 0 10px #44e8c4;opacity:.85;transition:1.1s cubic-bezier(.2,.8,.2,1)}.touch{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);z-index:8;width:clamp(132px,13vw,178px);height:clamp(132px,13vw,178px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:clamp(14px,1.5vw,20px);letter-spacing:.05em;color:#043c34;background:radial-gradient(circle at 35% 28%,#effffb,#7ef7de 38%,#20d5b2 64%,#0ca58a);box-shadow:0 0 0 2px #8fffe866,0 0 40px #28e1bd99,0 0 90px #14cda855;animation:pulse 1.45s ease-in-out infinite;cursor:pointer}.touch:before{content:'';position:absolute;inset:-16px;border:2px solid #65f6dc;border-radius:50%;opacity:.6}.touch.lock{pointer-events:none;opacity:.45}@keyframes pulse{50%{transform:translateX(-50%) scale(1.055)}}.phase{position:absolute;right:4%;top:50%;transform:translateY(-50%);z-index:7;display:flex;flex-direction:column;gap:14px}.phase b{display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;border:1px solid #66dccc55;color:#668f89;font-size:17px;transition:.4s}.phase b.on{color:#052d28;background:#7bf5df;border-color:#7bf5df;box-shadow:0 0 24px #49e7c6}.phase b.done{color:#70d8c7;border-color:#70d8c766}.flash{position:absolute;inset:-20%;z-index:10;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0,#fff7 8%,#52f8d288 23%,transparent 48%)}.flash.go{animation:flash .8s ease-out}@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}.winner{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 46%,#fff5b955 0,#ffcf4550 20%,transparent 44%),linear-gradient(180deg,#191303,#080601)}.winner.show{display:flex;animation:winIn .8s ease both}@keyframes winIn{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}.winner .spark{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 0 22%,#ffe88d22 23% 24%,transparent 25%),repeating-conic-gradient(from 0deg,#ffe57700 0 7deg,#ffe57722 8deg 9deg);animation:spin 18s linear infinite}.winnerBox{position:relative;z-index:2}.winK{font-size:clamp(13px,1.6vw,20px);font-weight:900;letter-spacing:.22em;color:#ffe483}.winName{margin-top:24px;font-size:clamp(65px,11vw,150px);font-weight:950;letter-spacing:-.06em;color:#fff9dc;text-shadow:0 0 15px #fff,0 0 35px #ffd867,0 0 90px #ffb72f}.winMsg{margin-top:24px;font-size:clamp(20px,2.6vw,36px);font-weight:900;color:#ffe9a8}.confetti{position:absolute;inset:0;pointer-events:none;z-index:30}.confetti i{position:absolute;top:-30px;width:10px;height:22px;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(850deg)}}@media(max-width:650px){.core{width:86vw;top:48%}.phase{right:3%;gap:9px}.phase b{width:42px;height:42px;font-size:14px}.touch{bottom:5.5%}.top{top:4%}}</style></head><body><div class="stage" id="stage"><div class="grid"></div><div class="top"><div class="kicker">LUCKY SPARK</div><div class="title">청년의 행운을 선택해주세요</div><div class="sub">이현석 지원장 · 대한민국 청년 금융교육 프로젝트</div></div><div class="particles" id="particles"></div><div class="core"><div class="halo"></div><div class="halo2"></div><div class="halo3"></div><div class="countWrap"><div class="count" id="count">100</div><div class="label" id="label">YOUTH</div><div class="mini" id="mini">100명의 이름은 보이지 않게, 행운만 남깁니다</div></div></div><div class="phase"><b id="p0" class="on">100</b><b id="p1">10</b><b id="p2">3</b><b id="p3">1</b></div><div class="touch" id="touch">TOUCH</div><div class="flash" id="flash"></div><div class="winner" id="winner"><div class="spark"></div><div class="winnerBox"><div class="winK">TODAY'S LUCKY SPARK</div><div class="winName" id="winName"></div><div class="winMsg">축하합니다!</div></div></div><div class="confetti" id="confetti"></div></div><script>const EVENT_NAMES=["강민혁","고원","공현배","곽다연","구가현","권상미","김규리","김남건","김도영","김동민","김민서","김민석","김민섭","김민승","김민지","김병욱","김세현","김수연","김윤진","김은성","김정현","김주현","김한비","김현빈","남도형","남연진","류지성","민예지","박가은","박경연","박민정","박민준","박솔리","박순호","박정윤","박정은","박주완","박준형(0613)","박준형(4527)","박채은","백산","백송희","서광","석아현","소민주","손대한","손한솔","손효지","심명준","심태웅","우다경","원도윤","유승빈","이규렬","이나경","이도완","이동욱","이민지","이상역","이상일","이서한","이선호","이소원","이소진","이수광","이수빈","이시연","이시영","이연진","이영예","이재진","이재호","이종민","이종탁","이주은","이준호","이지선","이지수","이진수","임서하","장영훈","장우진","장지윤","전현준","정가영","정민교","정수민","조성민","조성빈","조연주","조예솔","조예은","조은우","조해민","조현준","최원석","하서준","홍인성","황성호","손유하"];const KEY='im_youth_project_winners_v1';const count=document.getElementById('count'),label=document.getElementById('label'),mini=document.getElementById('mini'),touch=document.getElementById('touch'),flash=document.getElementById('flash'),particles=document.getElementById('particles');let phase=0,busy=false,pool=[],top10=[],final3=[];function used(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function eligible(a){const u=new Set(used());return a.filter(x=>!u.has(x))}function save(n){const a=used();if(!a.includes(n)){a.push(n);localStorage.setItem(KEY,JSON.stringify(a))}}function rint(max){if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(1),lim=0x100000000-(0x100000000%max);do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%max}return Math.floor(Math.random()*max)}function sample(a,n){const b=[...a];for(let i=b.length-1;i>0;i--){const j=rint(i+1);[b[i],b[j]]=[b[j],b[i]]}return b.slice(0,n)}function setPhase(n){phase=n;for(let i=0;i<4;i++){const e=document.getElementById('p'+i);e.className=i===n?'on':i<n?'done':''}}function makeDots(n=100){particles.innerHTML='';for(let i=0;i<n;i++){const d=document.createElement('i');d.className='dot';const s=3+Math.random()*6;d.style.width=d.style.height=s+'px';d.style.left=(6+Math.random()*88)+'%';d.style.top=(17+Math.random()*66)+'%';d.style.opacity=.25+Math.random()*.65;d.style.transform=`scale(${.6+Math.random()})`;particles.appendChild(d)}}function collapseDots(target){const dots=[...particles.children];dots.forEach((d,i)=>{const a=(i/Math.max(1,dots.length))*Math.PI*10+Math.random()*1.4;const rad=target===10?18:target===3?8:2;const x=50+Math.cos(a)*rad*(.4+Math.random()*.6);const y=50+Math.sin(a)*rad*(.4+Math.random()*.6);d.style.left=x+'%';d.style.top=y+'%';d.style.opacity=i<target?1:.07;d.style.transform=i<target?'scale(1.7)':'scale(.25)'})}function pulseFlash(){flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go')}function animateNumber(from,to,ms,done){busy=true;touch.classList.add('lock');let st=performance.now();function f(t){let p=Math.min(1,(t-st)/ms);let eased=1-Math.pow(1-p,3);count.textContent=Math.max(to,Math.round(from+(to-from)*eased));if(p<1)requestAnimationFrame(f);else{busy=false;touch.classList.remove('lock');done&&done()}}requestAnimationFrame(f)}function draw10(){pool=eligible(EVENT_NAMES);top10=sample(pool,10);setPhase(1);pulseFlash();collapseDots(10);label.textContent='TOP 10';mini.textContent='100개의 가능성이 10개의 빛으로 모였습니다';animateNumber(100,10,1350)}function draw3(){final3=sample(top10,3);setPhase(2);pulseFlash();collapseDots(3);label.textContent='FINAL 3';mini.textContent='행운의 빛이 단 3개로 압축됩니다';animateNumber(10,3,1150)}function draw1(){const w=sample(final3,1)[0];setPhase(3);pulseFlash();collapseDots(1);label.textContent='FINAL';mini.textContent='마지막 하나의 행운을 찾고 있습니다';animateNumber(3,1,1100,()=>setTimeout(()=>showWinner(w),550))}function showWinner(w){save(w);document.getElementById('winName').textContent=w;document.getElementById('winner').classList.add('show');confetti()}function confetti(){const box=document.getElementById('confetti'),cs=['#ffe36f','#fff4bd','#63f2d9','#ffffff'];for(let i=0;i<90;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.background=cs[i%cs.length];x.style.animationDelay=Math.random()*.8+'s';x.style.transform=`rotate(${Math.random()*180}deg)`;box.appendChild(x)}}function act(){if(busy)return;if(phase===0)draw10();else if(phase===1)draw3();else if(phase===2)draw1()}touch.addEventListener('pointerup',act);document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();act()}if(e.key==='r'||e.key==='R')location.reload();if(e.key==='x'||e.key==='X'){if(confirm('전체 추첨 당첨자 제외 기록을 초기화할까요?')){localStorage.removeItem(KEY);location.reload()}}});makeDots(100);</script></body></html>
