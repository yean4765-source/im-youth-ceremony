<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUCKY SPARK · 이현석 지원장</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,'Noto Sans KR','Malgun Gothic',sans-serif;background:linear-gradient(135deg,#eef6f7,#e9f4f4);color:#111827;user-select:none;touch-action:manipulation}.wrap{width:100vw;height:100vh;padding:2.2vh 1.2vw}.card{position:relative;width:100%;height:100%;border:1px solid #d8e3e6;border-radius:28px;background:#fff;box-shadow:0 12px 35px #143b4010;overflow:hidden}.top{text-align:center;padding-top:4vh}.kicker{font-size:clamp(12px,1.35vw,17px);font-weight:950;letter-spacing:.22em;color:#02b9ad}.title{margin-top:12px;font-size:clamp(30px,4vw,52px);font-weight:950;letter-spacing:-.055em;line-height:1.05}.sub{margin-top:10px;font-size:clamp(14px,1.75vw,22px);font-weight:750;color:#758195}.progress{display:flex;justify-content:center;gap:12px;margin-top:3.2vh}.step{min-width:120px;padding:10px 18px;border-radius:999px;background:#eef2f4;color:#99a2ad;font-weight:950;font-size:clamp(12px,1.4vw,17px);text-align:center;transition:.35s}.step.on{background:#06b8ac;color:white;box-shadow:0 8px 20px #06b8ac2f}.step.done{background:#dcf7f3;color:#16847b}.center{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:min(88%,900px);text-align:center}.badge{display:inline-block;padding:8px 15px;border-radius:999px;background:#e8f8f5;color:#087d75;font-size:clamp(11px,1.15vw,14px);font-weight:950;letter-spacing:.04em}.number{margin-top:16px;font-size:clamp(88px,12.5vw,155px);font-weight:950;line-height:.88;letter-spacing:-.075em;color:#09b9ad;transition:.25s;filter:drop-shadow(0 8px 18px #09b9ad16)}.label{margin-top:24px;font-size:clamp(18px,2.25vw,30px);font-weight:950;letter-spacing:-.025em}.touch{margin:4.2vh auto 0;width:min(420px,72vw);padding:22px 30px;border:0;border-radius:20px;background:linear-gradient(135deg,#08bcb0,#06aa9f);color:#fff;font-size:clamp(18px,2.2vw,29px);font-weight:950;box-shadow:0 17px 34px #04b7a82a;cursor:pointer;transition:.18s}.touch:active{transform:scale(.98)}.touch.lock{pointer-events:none;opacity:.55}.hint{margin-top:15px;font-size:clamp(13px,1.45vw,18px);font-weight:700;color:#7b8798}.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#1dcfc1;opacity:0;box-shadow:0 0 18px #1dcfc1;animation:spark 1.05s ease forwards}@keyframes spark{0%{opacity:0;transform:scale(.2)}35%{opacity:.85}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.7)}}.winner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 46%,#fff9d4 0,#fff6c85c 17%,transparent 39%),linear-gradient(180deg,#fffdf4,#fff);z-index:10}.winner.show{display:flex;animation:win .65s ease both}@keyframes win{from{opacity:0;transform:scale(1.025)}to{opacity:1;transform:scale(1)}}.winK{font-size:clamp(13px,1.4vw,18px);font-weight:950;letter-spacing:.2em;color:#b17b00}.winName{margin-top:24px;font-size:clamp(68px,10vw,132px);font-weight:950;letter-spacing:-.06em;color:#111827;text-shadow:0 0 28px #ffd76566}.winMsg{margin-top:24px;font-size:clamp(20px,2.2vw,30px);font-weight:950;color:#0a9b90}.confetti{position:absolute;inset:0;pointer-events:none;z-index:20}.confetti i{position:absolute;top:-25px;width:9px;height:20px;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(850deg)}}@media(max-width:650px){.wrap{padding:1vh 1vw}.card{border-radius:22px}.top{padding-top:3.2vh}.progress{gap:7px;margin-top:2.6vh}.step{min-width:0;flex:0 1 23%;padding:9px 6px}.center{top:57%}.touch{margin-top:3.4vh}}</style></head><body><div class="wrap"><main class="card"><div class="top"><div class="kicker">LUCKY SPARK</div><div class="title">100명의 청년 중 오늘의 행운은?</div><div class="sub">이현석 지원장님과 함께하는 100 → 10 → 3 → 1 서바이벌 추첨</div><div class="progress"><div class="step on" id="s0">START</div><div class="step" id="s1">TOP 10</div><div class="step" id="s2">FINAL 3</div><div class="step" id="s3">WINNER</div></div></div><section class="center"><div class="badge" id="badge">READY</div><div class="number" id="number">100</div><div class="label" id="label">명의 청년이 기다리고 있습니다</div><button class="touch" id="touch">지원장님, 첫 번째 터치!</button><div class="hint" id="hint">한 번의 터치로 TOP 10을 선정합니다.</div></section><div class="fx" id="fx"></div><div class="winner" id="winner"><div><div class="winK">TODAY'S LUCKY SPARK</div><div class="winName" id="winName"></div><div class="winMsg">축하합니다!</div></div></div><div class="confetti" id="confetti"></div></main></div><script>const EVENT_NAMES=["강민혁","고원","공현배","곽다연","구가현","권상미","김규리","김남건","김도영","김동민","김민서","김민석","김민섭","김민승","김민지","김병욱","김세현","김수연","김윤진","김은성","김정현","김주현","김한비","김현빈","남도형","남연진","류지성","민예지","박가은","박경연","박민정","박민준","박솔리","박순호","박정윤","박정은","박주완","박준형(0613)","박준형(4527)","박채은","백산","백송희","서광","석아현","소민주","손대한","손한솔","손효지","심명준","심태웅","우다경","원도윤","유승빈","이규렬","이나경","이도완","이동욱","이민지","이상역","이상일","이서한","이선호","이소원","이소진","이수광","이수빈","이시연","이시영","이연진","이영예","이재진","이재호","이종민","이종탁","이주은","이준호","이지선","이지수","이진수","임서하","장영훈","장우진","장지윤","전현준","정가영","정민교","정수민","조성민","조성빈","조연주","조예솔","조예은","조은우","조해민","조현준","최원석","하서준","홍인성","황성호","손유하"];const KEY='im_youth_project_winners_v1';const num=document.getElementById('number'),badge=document.getElementById('badge'),label=document.getElementById('label'),touch=document.getElementById('touch'),hint=document.getElementById('hint'),fx=document.getElementById('fx');let phase=0,busy=false,pool=[],top10=[],final3=[];function used(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function eligible(a){const u=new Set(used());return a.filter(x=>!u.has(x))}function save(n){const a=used();if(!a.includes(n)){a.push(n);localStorage.setItem(KEY,JSON.stringify(a))}}function rint(max){if(max<=0)return 0;if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(1),lim=0x100000000-(0x100000000%max);do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%max}return Math.floor(Math.random()*max)}function sample(a,n){const b=[...a];for(let i=b.length-1;i>0;i--){const j=rint(i+1);[b[i],b[j]]=[b[j],b[i]]}return b.slice(0,Math.min(n,b.length))}function steps(n){phase=n;for(let i=0;i<4;i++){const e=document.getElementById('s'+i);e.className='step'+(i===n?' on':i<n?' done':'')}}function sparks(){fx.innerHTML='';for(let i=0;i<42;i++){const d=document.createElement('i');d.className='dot';d.style.left=(42+Math.random()*16)+'%';d.style.top=(45+Math.random()*18)+'%';d.style.setProperty('--x',((Math.random()-.5)*520)+'px');d.style.setProperty('--y',((Math.random()-.5)*420)+'px');d.style.animationDelay=(Math.random()*.15)+'s';fx.appendChild(d)}}function animate(from,to,ms,done){busy=true;touch.classList.add('lock');sparks();const st=performance.now();function f(t){const p=Math.min(1,(t-st)/ms),e=1-Math.pow(1-p,3);num.textContent=Math.max(to,Math.round(from+(to-from)*e));if(p<1)requestAnimationFrame(f);else{busy=false;touch.classList.remove('lock');done&&done()}}requestAnimationFrame(f)}function first(){pool=eligible(EVENT_NAMES);if(pool.length<3)return;top10=sample(pool,10);steps(1);badge.textContent='TOP 10';label.textContent='개의 행운이 남았습니다';hint.textContent='이제 10명에서 단 3명만 남습니다.';touch.textContent='지원장님, 두 번째 터치!';animate(pool.length,10,1200)}function second(){final3=sample(top10,3);steps(2);badge.textContent='FINAL 3';label.textContent='개의 행운이 남았습니다';hint.textContent='마지막 한 명을 향해 갑니다.';touch.textContent='3 · 2 · 1 최종 터치!';animate(10,3,1050)}function third(){const w=sample(final3,1)[0];steps(3);badge.textContent='FINAL';label.textContent='개의 행운';hint.textContent='오늘의 LUCKY SPARK를 공개합니다.';touch.textContent='WINNER';animate(3,1,1050,()=>setTimeout(()=>showWinner(w),450))}function showWinner(w){save(w);document.getElementById('winName').textContent=w;document.getElementById('winner').classList.add('show');confetti()}function confetti(){const box=document.getElementById('confetti'),cs=['#06b8ac','#67ded5','#ffd166','#ff8d73','#7da5ff'];for(let i=0;i<85;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.background=cs[i%cs.length];x.style.animationDelay=Math.random()*.8+'s';box.appendChild(x)}}function act(){if(busy)return;if(phase===0)first();else if(phase===1)second();else if(phase===2)third()}touch.addEventListener('pointerup',act);document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();act()}if(e.key==='r'||e.key==='R')location.reload();if(e.key==='x'||e.key==='X'){if(confirm('당첨자 제외 기록을 모두 초기화할까요?')){localStorage.removeItem(KEY);location.reload()}}});pool=eligible(EVENT_NAMES);num.textContent=pool.length;label.textContent='명의 청년이 기다리고 있습니다';</script></body></html>
