<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BETTER TOMORROW - 청년특보 전용 추첨</title>
<style>
:root{
  --mint:#00B7A8; --mint2:#7CE7DC; --dark:#0E1720; --bg:#071311;
  --white:#fff; --muted:#AFC0BD; --gold:#FFD166; --blue:#4D96FF;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;background:#071311;color:#fff}
body{
  background:
    radial-gradient(circle at 18% 18%, rgba(0,183,168,.11), transparent 25%),
    radial-gradient(circle at 82% 82%, rgba(77,150,255,.09), transparent 28%),
    linear-gradient(135deg,#06110F,#0A1716 55%,#07110F);
}
.topbar{
  position:absolute;top:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:space-between;
  padding:0 34px;border-bottom:1px solid rgba(255,255,255,.08);z-index:50;
  background:rgba(7,19,17,.48);backdrop-filter:blur(10px)
}
.brand{font-size:20px;font-weight:950;letter-spacing:-.5px}
.brand b{color:var(--mint2)}
.mode{font-size:12px;color:#8FA4A1;letter-spacing:2px;font-weight:850}
#app{height:100%;padding-top:84px;position:relative}
.stage{height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.center{position:relative;z-index:10;text-align:center;max-width:1100px;padding:24px}
.kicker{font-size:14px;letter-spacing:4px;color:var(--mint2);font-weight:950;margin-bottom:14px}
h1{margin:0;font-size:58px;line-height:1.07;letter-spacing:-2.6px}
.sub{font-size:20px;line-height:1.55;color:#B7C5C2;margin-top:16px}
.mainbtn{
  margin-top:34px;border:2px solid rgba(124,231,220,.45);border-radius:999px;padding:20px 40px;
  background:linear-gradient(135deg,#10C8B9,#008F84);color:#fff;font-size:23px;font-weight:1000;
  box-shadow:0 0 0 15px rgba(0,183,168,.05),0 16px 40px rgba(0,183,168,.27);
  cursor:pointer;transition:.18s;touch-action:manipulation
}
.mainbtn:hover{transform:translateY(-2px) scale(1.015)}
.mainbtn small{display:block;font-size:11px;letter-spacing:2.5px;margin-top:5px;opacity:.9}
#namesLayer{position:absolute;inset:84px 0 0;z-index:2;pointer-events:none}
.name{
  position:absolute;padding:7px 11px;border-radius:999px;border:1px solid rgba(124,231,220,.16);
  background:rgba(255,255,255,.035);color:rgba(221,245,242,.64);font-size:13px;font-weight:750;white-space:nowrap;
  animation:floaty var(--d) ease-in-out infinite alternate;transition:opacity .7s ease, transform .8s ease
}
@keyframes floaty{
  from{transform:translate(-8px,-6px) scale(.96);opacity:.35}
  to{transform:translate(8px,10px) scale(1.04);opacity:.92}
}
.phaseWord{
  font-size:112px;font-weight:1000;letter-spacing:-5px;line-height:.95;
  text-shadow:0 0 45px rgba(0,183,168,.26);animation:wordIn .75s ease both
}
.phaseKo{font-size:26px;font-weight:900;margin-top:15px;color:#D8E8E5;animation:fadeUp .8s ease both}
.phaseDesc{font-size:17px;color:#AEBFBC;margin-top:10px;animation:fadeUp 1s ease both}
@keyframes wordIn{0%{opacity:0;transform:scale(.72) translateY(20px);filter:blur(10px)}100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
.line{
  width:0;height:3px;margin:26px auto 0;border-radius:99px;background:linear-gradient(90deg,transparent,var(--mint2),transparent);
  animation:lineGrow 1s ease forwards
}
@keyframes lineGrow{to{width:520px}}
.scanLabel{font-size:14px;letter-spacing:4px;color:var(--mint2);font-weight:950;margin-bottom:18px}
.slot{
  min-width:740px;max-width:90vw;padding:30px 44px;border-radius:24px;border:1px solid rgba(124,231,220,.22);
  background:rgba(255,255,255,.045);box-shadow:inset 0 0 35px rgba(0,183,168,.05),0 18px 50px rgba(0,0,0,.25);
  font-size:62px;font-weight:1000;letter-spacing:-2px
}
.winnerWrap{position:relative}
.winnerLabel{font-size:15px;letter-spacing:4px;color:var(--gold);font-weight:950;margin-bottom:16px}
.winner{
  display:inline-block;padding:30px 48px;border-radius:28px;border:3px solid var(--gold);
  background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(0,183,168,.07));
  font-size:82px;font-weight:1000;letter-spacing:-3px;box-shadow:0 22px 58px rgba(0,183,168,.15)
}
.congrats{font-size:24px;color:#D6E4E2;margin-top:18px}
.tagline{font-size:20px;color:var(--mint2);font-weight:950;margin-top:14px}
.ring{
  position:absolute;border:1px solid rgba(124,231,220,.2);border-radius:50%;left:50%;top:50%;
  transform:translate(-50%,-50%);animation:ring 2s ease-out infinite;pointer-events:none
}
.r1{width:360px;height:360px}.r2{width:530px;height:530px;animation-delay:.5s}.r3{width:720px;height:720px;animation-delay:1s}
@keyframes ring{0%{opacity:.5;transform:translate(-50%,-50%) scale(.75)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
.wave{
  position:absolute;left:-25%;top:0;width:25%;height:100%;z-index:5;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(124,231,220,.22),rgba(255,255,255,.22),rgba(124,231,220,.15),transparent);
  filter:blur(8px);opacity:0
}
.wave.go{animation:waveMove 1.25s ease-in-out}
@keyframes waveMove{0%{left:-25%;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:110%;opacity:0}}
.flash{position:absolute;inset:0;background:#fff;z-index:35;opacity:0;pointer-events:none}
.flash.go{animation:flash .42s ease}
@keyframes flash{0%{opacity:0}35%{opacity:.93}100%{opacity:0}}
.confetti{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;width:9px;height:18px;animation:fall 3.1s linear forwards}
@keyframes fall{from{transform:translateY(-70px) rotate(0)}to{transform:translateY(110vh) rotate(760deg)}}
.controls{position:absolute;right:18px;bottom:18px;z-index:70;display:flex;gap:7px;opacity:.18;transition:.2s}
.controls:hover{opacity:1}
.controls button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;border-radius:10px;padding:8px 11px;cursor:pointer}
.drawer{
  position:absolute;right:18px;bottom:60px;width:330px;z-index:80;background:#10201E;border:1px solid rgba(255,255,255,.12);
  border-radius:16px;padding:15px;box-shadow:0 18px 50px rgba(0,0,0,.35)
}
.drawer textarea{width:100%;height:260px;background:#081411;color:#E5F2F0;border:1px solid rgba(255,255,255,.13);border-radius:11px;padding:11px;resize:none}
.drawer .row{display:flex;gap:8px;margin-top:9px}
.drawer button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:900;cursor:pointer}
.apply{background:var(--mint);color:white}.close{background:#263836;color:white}
.status{font-size:12px;color:#AFC0BD;margin-top:8px}
.hide{display:none!important}
@media(max-width:850px){
  h1{font-size:42px}.sub{font-size:17px}.phaseWord{font-size:75px}.slot{min-width:0;font-size:43px}.winner{font-size:58px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><b>iM</b> 대한민국 청년 금융교육 프로젝트</div>
  <div class="mode">BETTER TOMORROW · YOUTH SPECIAL</div>
</div>

<div id="app">
  <div class="stage">
    <div id="namesLayer"></div>
    <div id="wave" class="wave"></div>
    <div class="center" id="content"></div>
    <div id="flash" class="flash"></div>
    <div id="confetti" class="confetti"></div>

    <div class="controls">
      <button onclick="toggleDrawer()">명단</button>
      <button onclick="resetAll()">초기화</button>
    </div>

    <div id="drawer" class="drawer hide">
      <b>참여자 명단</b>
      <div style="font-size:12px;color:#AFC0BD;margin:6px 0 9px">한 줄에 한 명씩 입력</div>
      <textarea id="namesInput"></textarea>
      <div class="row">
        <button class="apply" onclick="applyNames()">명단 적용</button>
        <button class="close" onclick="toggleDrawer()">닫기</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>
</div>

<script>
let names=[], running=false, winner=null;

function secureRandomInt(max){
  if(max<=0) return 0;
  if(window.crypto && crypto.getRandomValues){
    const range=0x100000000, limit=range-(range%max);
    const a=new Uint32Array(1);
    do{ crypto.getRandomValues(a); }while(a[0]>=limit);
    return a[0]%max;
  }
  return Math.floor(Math.random()*max);
}
function secureChoice(arr){ return arr[secureRandomInt(arr.length)]; }

const SHARED_WINNER_KEY='im_youth_project_winners_v1';
function getSharedWinners(){
  try{return JSON.parse(localStorage.getItem(SHARED_WINNER_KEY)||'[]');}catch(e){return [];}
}
function saveSharedWinner(n){
  if(!n)return;
  const a=getSharedWinners();
  if(!a.includes(n)){a.push(n);localStorage.setItem(SHARED_WINNER_KEY,JSON.stringify(a));}
}
function clearSharedWinners(){
  if(confirm('앞선 추첨의 당첨자 제외 기록을 모두 초기화할까요?')){
    localStorage.removeItem(SHARED_WINNER_KEY);
    location.reload();
  }
}
function eligibleFrom(arr){
  const used=new Set(getSharedWinners());
  return arr.filter(n=>!used.has(n));
}
function sharedStatusText(){
  const used=getSharedWinners();
  return used.length ? ` · 이전 당첨 ${used.length}명 자동 제외` : ' · 중복 당첨 자동 제외';
}

const EVENT_NAMES = ["강민혁", "고원", "공현배", "곽다연", "구가현", "권상미", "김규리", "김남건", "김도영", "김동민", "김민서", "김민석", "김민섭", "김민승", "김민지", "김병욱", "김세현", "김수연", "김윤진", "김은성", "김정현", "김주현", "김한비", "김현빈", "남도형", "남연진", "류지성", "민예지", "박가은", "박경연", "박민정", "박민준", "박솔리", "박순호", "박정윤", "박정은", "박주완", "박준형(0613)", "박준형(4527)", "박채은", "백산", "백송희", "서광", "석아현", "소민주", "손대한", "손한솔", "손효지", "심명준", "심태웅", "우다경", "원도윤", "유승빈", "이규렬", "이나경", "이도완", "이동욱", "이민지", "이상역", "이상일", "이서한", "이선호", "이소원", "이소진", "이수광", "이수빈", "이시연", "이시영", "이연진", "이영예", "이재진", "이재호", "이종민", "이종탁", "이주은", "이준호", "이지선", "이지수", "이진수", "임서하", "장영훈", "장우진", "장지윤", "전현준", "정가영", "정민교", "정수민", "조성민", "조성빈", "조연주", "조예솔", "조예은", "조은우", "조해민", "조현준", "최원석", "하서준", "홍인성", "황성호", "손유하"];

function loadEventNames(){
  const el=document.getElementById('namesInput');
  if(el) el.value=EVENT_NAMES.join('\n');
}
function demoNames(){ loadEventNames(); applyNames(); }
function parseNames(){
  return [...new Set(document.getElementById('namesInput').value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean))];
}
function applyNames(){
  names=parseNames(); winner=null; running=false; renderNames(); renderReady(); updateStatus(); toggleDrawer(false);
}
function updateStatus(){document.getElementById('status').textContent=`현재 ${names.length}명 등록${sharedStatusText()}`}
function toggleDrawer(force){
  const d=document.getElementById('drawer');
  if(force===false)d.classList.add('hide');else d.classList.toggle('hide');
}
function maskName(n){ return n; }
function renderNames(){
  const layer=document.getElementById('namesLayer');layer.innerHTML='';
  names.slice(0,120).forEach((n,i)=>{
    const e=document.createElement('div');e.className='name';e.textContent=maskName(n);
    const ang=Math.random()*Math.PI*2,rad=27+Math.random()*42;
    let x=50+Math.cos(ang)*rad,y=50+Math.sin(ang)*rad;
    x=Math.max(3,Math.min(91,x));y=Math.max(3,Math.min(88,y));
    e.style.left=x+'%';e.style.top=y+'%';e.style.setProperty('--d',(2.2+Math.random()*3.7)+'s');
    e.style.animationDelay=(-Math.random()*3)+'s';layer.appendChild(e);
  });
}
function renderReady(){
  document.getElementById('content').innerHTML=`
    <div class="kicker">BETTER TOMORROW</div>
    <h1>청년과 함께<br>변화와 성장, 더 나은 내일을 만들겠습니다.</h1>
    <div class="sub">박성민 청년특보님의 한 번의 터치로<br>오늘의 행운을 시작합니다.</div>
    <button class="mainbtn" onclick="startSequence()" ${eligibleFrom(names).length<1?'disabled':''}>
      BETTER TOMORROW
      <small>TOUCH TO BEGIN</small>
    </button>`;
}
function animateWave(){
  const w=document.getElementById('wave');
  w.classList.remove('go');void w.offsetWidth;w.classList.add('go');
}
function showPhase(en,ko,desc,next,delay=1250){
  animateWave();beep(520+Math.random()*100,.12);
  document.getElementById('content').innerHTML=`
    <div class="phaseWord">${en}</div>
    <div class="phaseKo">${ko}</div>
    <div class="phaseDesc">${desc}</div>
    <div class="line"></div>`;
  setTimeout(next,delay);
}
function startSequence(){
  const eligible=eligibleFrom(names); if(running||eligible.length<1)return;
  running=true;
  document.getElementById('namesLayer').style.opacity='.35';
  showPhase('CHANGE','변화','청년의 가능성을 깨우고',()=>{
    showPhase('GROWTH','성장','도전이 성장으로 이어지고',()=>{
      showPhase('TOMORROW','내일','더 나은 내일을 향해',scanNames,1350);
    },1250);
  },1250);
}
function scanNames(){
  const drawNames=eligibleFrom(names); if(!drawNames.length){running=false;return;}
  const f=document.getElementById('flash');
  f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  const content=document.getElementById('content');
  let elapsed=0,interval=70,total=3000;
  function tick(){
    const n=secureChoice(drawNames);
    content.innerHTML=`<div class="scanLabel">FINDING TODAY'S BETTER TOMORROW</div><div class="slot">${maskName(n)}</div>`;
    beep(620+Math.random()*210,.025);
    elapsed+=interval;
    if(elapsed<total){
      if(elapsed>1800)interval=115;
      if(elapsed>2450)interval=180;
      setTimeout(tick,interval);
    }else{
      winner=secureChoice(drawNames);
      revealWinner();
    }
  }
  tick();
}
function revealWinner(){
  saveSharedWinner(winner);
  fanfare();makeConfetti();
  document.getElementById('content').innerHTML=`
    <div class="winnerWrap">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="winnerLabel">BETTER TOMORROW</div>
      <div class="winner">✨ ${maskName(winner)} ✨</div>
      <div class="congrats">축하합니다!</div>
      <div class="tagline">청년의 더 나은 내일을 응원합니다.</div>
    </div>`;
  running=false;
}
function resetAll(){
  running=false;winner=null;document.getElementById('namesLayer').style.opacity='1';renderNames();renderReady();
}
function makeConfetti(){
  const box=document.getElementById('confetti');box.innerHTML='';
  const colors=['#00B7A8','#7CE7DC','#FFD166','#4D96FF','#FFFFFF','#FF6B6B'];
  for(let i=0;i<110;i++){
    const e=document.createElement('i');e.style.left=Math.random()*100+'%';
    e.style.top=(-40-Math.random()*120)+'px';e.style.background=colors[Math.floor(Math.random()*colors.length)];
    e.style.animationDelay=(Math.random()*.8)+'s';box.appendChild(e);
  }
}
function beep(freq=600,dur=.06){
  try{
    const ac=window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());
    const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
    o.frequency.value=freq;g.gain.setValueAtTime(.026,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}
function fanfare(){
  [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,.19),i*120));
}
document.addEventListener('keydown',e=>{
  if(e.key==='x'||e.key==='X'){clearSharedWinners();return;}
  if(e.code==='Space'&&!running){e.preventDefault();startSequence()}
  if(e.key==='r'||e.key==='R')resetAll();
});
loadEventNames(); applyNames();
</script>
</body>
</html>
