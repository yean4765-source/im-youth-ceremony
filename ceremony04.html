<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>세레머니 4</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020d0c;font-family:Arial,'Noto Sans KR',sans-serif;color:#f5fffb;user-select:none;touch-action:manipulation}.s{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 80%,#31d8ad29,transparent 35%),linear-gradient(#061714,#020b0a);transition:background 2.2s ease}.s.gold{background:radial-gradient(circle at 50% 52%,#fff1a933,transparent 20%),radial-gradient(circle at 50% 75%,#ffb52e55,transparent 45%),linear-gradient(#211703,#080501)}.c{position:relative;width:94vw;height:96vh;max-width:720px;max-height:1220px;border:1px solid #78f6d04d;border-radius:30px;overflow:hidden;background:#061b18ee;box-shadow:0 25px 90px #0009;transition:2.2s ease}.gold .c{border-color:#ffe28a99;background:#171104f2;box-shadow:inset 0 0 100px #ffd66b22,0 0 70px #ffb52e33}.h{position:absolute;top:5%;left:4%;right:4%;text-align:center;z-index:5}.k{font-size:clamp(12px,2.5vw,18px);letter-spacing:.08em;opacity:.62}.p{position:absolute;inset:16% 5% 27%;transition:1.6s ease}.launch .p,.gold .p{opacity:0;filter:blur(12px);transform:scale(.96)}.p i{position:absolute;width:43%;font-style:normal;font-size:clamp(11px,2.3vw,16px);line-height:1.35;color:#b0ffe6c7}.p i:before{content:'✦ ';color:#78f6d0}.p i:nth-child(1){left:1%;top:2%}.p i:nth-child(2){right:1%;top:2%}.p i:nth-child(3){left:1%;top:29%}.p i:nth-child(4){right:1%;top:29%}.p i:nth-child(5){left:1%;top:58%}.p i:nth-child(6){right:1%;top:58%}.p i:nth-child(7){left:7%;bottom:0}.p i:nth-child(8){right:7%;bottom:0}.mid{position:absolute;inset:25% 2% 25%;display:flex;align-items:center;justify-content:center;text-align:center;z-index:4;perspective:1200px}.hero{font-size:clamp(50px,12vw,96px);font-weight:950;letter-spacing:-.05em;line-height:1.06;color:#bfffee;opacity:0;transform:scale(.75);filter:blur(12px)}.hero.show{animation:show 1.1s forwards}@keyframes show{70%{opacity:1;transform:scale(1.05);filter:blur(0)}100%{opacity:1;transform:scale(1);filter:blur(0)}}.launch .hero.old{animation:oldAway .9s ease forwards}@keyframes oldAway{to{opacity:0;transform:scale(1.18);filter:blur(15px)}}.letters{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;pointer-events:none}.letters span{display:inline-block;font-size:clamp(42px,9.4vw,76px);font-weight:950;letter-spacing:-.08em;line-height:1;color:#fff8d8;text-shadow:0 0 10px #fff,0 0 28px #ffd66bbb,0 0 65px #ffb52e77;opacity:0;transform:translateZ(-900px) scale(.08) rotateY(-18deg);filter:blur(24px)}.launch .letters span{animation:letterIn 1.05s cubic-bezier(.12,.78,.18,1) forwards}.launch .letters span:nth-child(1){animation-delay:1s}.launch .letters span:nth-child(2){animation-delay:1.65s}.launch .letters span:nth-child(3){animation-delay:2.30s}.launch .letters span:nth-child(4){animation-delay:2.95s}.launch .letters span:nth-child(5){animation-delay:3.60s}.launch .letters span:nth-child(6){animation-delay:4.25s}.launch .letters span:nth-child(7){animation-delay:4.90s}@keyframes letterIn{0%{opacity:0;transform:translateZ(-900px) scale(.08) rotateY(-18deg);filter:blur(24px)}55%{opacity:1;filter:blur(3px)}82%{opacity:1;transform:translateZ(70px) scale(1.09) rotateY(0);filter:blur(0)}100%{opacity:1;transform:translateZ(0) scale(1) rotateY(0);filter:blur(0)}}.impact{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff7c9;box-shadow:0 0 28px 12px #ffd66b,0 0 80px 36px #ffb52e88;opacity:0}.launch .impact{animation:impact 1.25s ease 5.65s forwards}@keyframes impact{0%{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(1.8)}100%{opacity:0;transform:scale(16)}}.touch{position:absolute;z-index:9;left:50%;bottom:8%;transform:translateX(-50%);width:140px;height:140px;border-radius:50%;transition:.6s ease}.launch .touch{opacity:0;transform:translateX(-50%) scale(.78);pointer-events:none}.ring,.core{position:absolute;border-radius:50%}.ring{inset:0;border:2px solid #78f6d0;box-shadow:0 0 30px #78f6d0aa;animation:pulse 1.5s infinite}.core{inset:38px;background:radial-gradient(circle at 35% 30%,#e2fff7,#49ddb8 42%,#31d8ad33);box-shadow:0 0 35px #78f6d0}@keyframes pulse{50%{transform:scale(1.1)}}.tt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#063b31;font-weight:900;font-size:14px}.cap{position:absolute;top:150px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;opacity:.65}.stars{position:absolute;inset:0;pointer-events:none;opacity:0;transition:1s}.gold .stars{opacity:1}.stars b{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff2b0;box-shadow:0 0 18px 5px #ffd66b;animation:tw .8s infinite alternate}.stars b:nth-child(1){left:10%;top:20%}.stars b:nth-child(2){left:22%;top:65%}.stars b:nth-child(3){left:42%;top:18%}.stars b:nth-child(4){left:62%;top:72%}.stars b:nth-child(5){left:86%;top:26%}.stars b:nth-child(6){left:78%;top:52%}.stars b:nth-child(7){left:52%;top:38%}.stars b:nth-child(8){left:31%;top:49%}@keyframes tw{to{transform:scale(2.4);opacity:.25}}</style></head><body><div id="s" class="s"><div class="c"><div class="h"><div class="k">100개의 다짐 · 4개의 약속 · 하나의 내일</div></div><div class="p"><i>더 나은 세상을 만들겠습니다</i><i>청년의 가능성으로 미래를 밝히겠습니다</i><i>함께라서 더 강해지겠습니다</i><i>변화를 만드는 주인공이 되겠습니다</i><i>오늘의 다짐이 내일의 역사가 되게 하겠습니다</i><i>우리의 내일은 희망으로 빛날 것입니다</i><i>서로의 성장을 응원하겠습니다</i><i>배운 것을 실천하겠습니다</i></div><div class="mid"><div id="hero" class="hero old">하나의 내일</div><div class="letters"><span>만</span><span>들</span><span>겠</span><span>습</span><span>니</span><span>다</span><span>.</span><i class="impact"></i></div></div><div class="stars"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div><div id="touch" class="touch"><div class="ring"></div><div class="core"></div><div class="tt">TOUCH</div><div class="cap">터치해주세요</div></div></div></div><script>const s=document.getElementById('s'),h=document.getElementById('hero');h.classList.add('show');let done=0;function go(){if(done)return;done=1;s.classList.add('launch');setTimeout(()=>s.classList.add('gold'),5600)}document.getElementById('touch').addEventListener('pointerup',e=>{e.stopPropagation();go()});</script></body></html>
