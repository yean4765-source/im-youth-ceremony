<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>변화와 성장 · 더 나은 내일</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#110b01;font-family:Arial,'Noto Sans KR','Malgun Gothic',sans-serif;color:#fff}.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 48%,#fff1a938,transparent 20%),radial-gradient(circle at 50% 70%,#ffb52e38,transparent 46%),linear-gradient(135deg,#211703,#080501)}.rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,#ffe89a00 0 8deg,#ffe89a10 9deg 10deg);animation:spin 26s linear infinite}.kicker{position:absolute;top:8%;left:0;right:0;text-align:center;font-size:clamp(15px,1.3vw,24px);font-weight:900;letter-spacing:.2em;color:#ffe797;z-index:6}.row{position:relative;z-index:4;width:95%;display:grid;grid-template-columns:repeat(4,1fr);gap:1.4vw}.card{position:relative;min-width:0;height:41vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:1.6vw;border-radius:2vw;border:1px solid #ffe28a88;background:linear-gradient(180deg,#3a2a0bc7,#171004e8);box-shadow:inset 0 0 80px #ffd66b1f,0 0 55px #ffb52e25;overflow:hidden;animation:burst 1.15s cubic-bezier(.18,.8,.2,1) both}.card:nth-child(2){animation-delay:.16s}.card:nth-child(3){animation-delay:.32s}.card:nth-child(4){animation-delay:.48s}.text{position:relative;z-index:2;font-weight:950;line-height:1.03;letter-spacing:-.075em;color:#fff9dc;text-shadow:0 0 12px #fff,0 0 30px #ffd66bcc,0 0 70px #ffb52e99;font-size:clamp(32px,3.8vw,72px);word-break:keep-all}.card:nth-child(2) .text{font-size:clamp(30px,3.4vw,65px);line-height:1.1}.card:nth-child(4) .text{font-size:clamp(28px,3.25vw,62px);white-space:nowrap}.mint{position:absolute;inset:0;z-index:2;pointer-events:none}.mint i{position:absolute;width:6px;height:6px;border-radius:50%;background:#86ffe7;box-shadow:0 0 16px 5px #40e6c3aa;opacity:0;animation:drift linear infinite}.burstfx{position:absolute;z-index:3;width:12px;height:12px;border-radius:50%;background:#dffff7;box-shadow:0 0 24px 8px #55f2d2;opacity:0}.burstfx:before,.burstfx:after{content:'';position:absolute;left:50%;top:50%;width:2px;height:2px;border-radius:50%;background:#aaffee;box-shadow:0 -54px 0 2px #8fffe8,38px -38px 0 1px #cafff5,54px 0 0 2px #72f5dc,38px 38px 0 1px #baffee,0 54px 0 2px #76f6dd,-38px 38px 0 1px #cffff8,-54px 0 0 2px #78f7df,-38px -38px 0 1px #b9fff0;transform:translate(-50%,-50%) scale(.15);opacity:0;animation:firework 3.8s ease-out infinite}.b1{left:18%;top:28%}.b2{left:50%;top:23%}.b3{right:15%;top:34%}.b1:before{animation-delay:.2s}.b2:before{animation-delay:1.35s}.b3:before{animation-delay:2.45s}.footer{position:absolute;bottom:8%;left:0;right:0;text-align:center;font-size:clamp(15px,1.5vw,25px);font-weight:900;letter-spacing:.09em;color:#ffe8a5;text-shadow:0 0 18px #ffcc57aa;z-index:5}@keyframes burst{0%{opacity:0;transform:scale(.68);filter:blur(16px)}65%{opacity:1;transform:scale(1.07);filter:none}100%{opacity:1;transform:scale(1)}}@keyframes drift{0%{transform:translateY(16vh) scale(.4);opacity:0}18%{opacity:.75}60%{opacity:.55}100%{transform:translate(var(--dx),-95vh) scale(.15);opacity:0}}@keyframes firework{0%,70%{opacity:0;transform:translate(-50%,-50%) scale(.1)}76%{opacity:1}90%{opacity:.8;transform:translate(-50%,-50%) scale(1.45)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.85)}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-aspect-ratio:1.3/1){.row{gap:.8vw}.card{height:34vh;padding:1vw}.text{font-size:clamp(24px,3.1vw,50px)}.card:nth-child(2) .text{font-size:clamp(23px,2.8vw,46px)}.card:nth-child(4) .text{font-size:clamp(22px,2.7vw,44px)}}</style></head><body><div class="stage"><div class="rays"></div><div class="kicker">100개의 다짐 · 4개의 약속 · 하나의 내일</div><div class="mint"></div><div class="burstfx b1"></div><div class="burstfx b2"></div><div class="burstfx b3"></div><div class="row"><div class="card"><div class="text">변화와 성장</div></div><div class="card"><div class="text">더 나은<br>내일을</div></div><div class="card"><div class="text">청년과 함께</div></div><div class="card"><div class="text">만들겠습니다.</div></div></div><div class="footer">청년의 가능성과 함께, 더 나은 내일을 만들겠습니다.</div></div><script>const p=document.querySelector('.mint');for(let i=0;i<46;i++){const e=document.createElement('i');e.style.left=(3+Math.random()*94)+'%';e.style.bottom=(-8+Math.random()*18)+'%';e.style.animationDuration=(4.8+Math.random()*4.5)+'s';e.style.animationDelay=(-Math.random()*8)+'s';e.style.setProperty('--dx',(Math.random()*150-75)+'px');p.appendChild(e)}</script></body></html>
