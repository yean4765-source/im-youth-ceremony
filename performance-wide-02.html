<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>변화와 성장 · 더 나은 내일</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#110b01;font-family:Arial,'Noto Sans KR','Malgun Gothic',sans-serif;color:#fff}.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 48%,#fff1a93d,transparent 20%),radial-gradient(circle at 50% 70%,#ffb52e42,transparent 45%),linear-gradient(135deg,#211703,#080501)}.rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,#ffe89a00 0 7deg,#ffe89a13 8deg 9deg);animation:spin 24s linear infinite}.kicker{position:absolute;top:8%;left:0;right:0;text-align:center;font-size:clamp(15px,1.3vw,24px);font-weight:900;letter-spacing:.2em;color:#ffe797}.row{position:relative;z-index:3;width:95%;display:grid;grid-template-columns:repeat(4,1fr);gap:1.4vw}.card{position:relative;min-width:0;height:41vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:1.6vw;border-radius:2vw;border:1px solid #ffe28a88;background:linear-gradient(180deg,#3a2a0bc7,#171004e8);box-shadow:inset 0 0 80px #ffd66b1f,0 0 55px #ffb52e25;overflow:hidden;animation:burst 1.15s cubic-bezier(.18,.8,.2,1) both}.card:nth-child(2){animation-delay:.16s}.card:nth-child(3){animation-delay:.32s}.card:nth-child(4){animation-delay:.48s}.card:before{content:'';position:absolute;width:13vw;height:13vw;border-radius:50%;border:1px solid #fff0a966;box-shadow:0 0 70px #ffd66b55;animation:pulse 1.8s ease-in-out infinite}.text{position:relative;z-index:2;font-weight:950;line-height:1.03;letter-spacing:-.075em;color:#fff9dc;text-shadow:0 0 12px #fff,0 0 30px #ffd66bcc,0 0 70px #ffb52e99;font-size:clamp(32px,3.8vw,72px);word-break:keep-all}.card:nth-child(2) .text{font-size:clamp(30px,3.4vw,65px);line-height:1.1}.card:nth-child(4) .text{font-size:clamp(28px,3.25vw,62px);white-space:nowrap}.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff2b0;box-shadow:0 0 20px 7px #ffd66b;animation:tw .8s infinite alternate}.s1{left:6%;top:20%}.s2{left:19%;bottom:17%;animation-delay:.25s}.s3{left:40%;top:15%;animation-delay:.5s}.s4{left:59%;bottom:14%;animation-delay:.15s}.s5{right:18%;top:22%;animation-delay:.7s}.s6{right:5%;bottom:24%;animation-delay:.4s}.footer{position:absolute;bottom:8%;left:0;right:0;text-align:center;font-size:clamp(15px,1.5vw,25px);font-weight:900;letter-spacing:.09em;color:#ffe8a5;text-shadow:0 0 18px #ffcc57aa}@keyframes burst{0%{opacity:0;transform:scale(.68);filter:blur(16px)}65%{opacity:1;transform:scale(1.07);filter:none}100%{opacity:1;transform:scale(1)}}@keyframes pulse{50%{transform:scale(1.16);opacity:.5}}@keyframes tw{to{transform:scale(2.4);opacity:.22}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-aspect-ratio:1.3/1){.row{gap:.8vw}.card{height:34vh;padding:1vw}.text{font-size:clamp(24px,3.1vw,50px)}.card:nth-child(2) .text{font-size:clamp(23px,2.8vw,46px)}.card:nth-child(4) .text{font-size:clamp(22px,2.7vw,44px)}}</style></head><body><div class="stage"><div class="rays"></div><div class="kicker">100개의 다짐 · 4개의 약속 · 하나의 내일</div><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i><i class="spark s6"></i><div class="row"><div class="card"><div class="text">변화와 성장</div></div><div class="card"><div class="text">더 나은<br>내일을</div></div><div class="card"><div class="text">청년과 함께</div></div><div class="card"><div class="text">만들겠습니다.</div></div></div><div class="footer">청년의 가능성과 함께, 더 나은 내일을 만들겠습니다.</div></div></body></html>
