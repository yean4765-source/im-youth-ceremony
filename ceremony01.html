3% 25%;display:flex;align-items:center;justify-content:center;text-align:center;z-index:4;perspective:1000px}.hero{font-size:clamp(50px,12vw,96px);font-weight:950;letter-spacing:-.05em;line-height:1.06;color:#bfffee;opacity:0;transform:scale(.75);filter:blur(12px)}.hero.show{animation:show 1.1s forwards}@keyframes show{70%{opacity:1;transform:scale(1.05);filter:blur(0)}100%{opacity:1;transform:scale(1);filter:blur(0)}}.launch .hero.old{animation:oldAway .55s ease forwards}@keyframes oldAway{to{opacity:0;transform:scale(1.35);filter:blur(14px)}}.cinematic{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.02em;pointer-events:none;opacity:0}.launch .cinematic{opacity:1}.fly{display:block;font-size:clamp(58px,14vw,112px);font-weight:950;letter-spacing:-.07em;line-height:.95;color:#fff8d8;text-shadow:0 0 12px #fff,0 0 30px #ffd66bcc,0 0 70px #ffb52e99;opacity:0;transform:translateZ(-900px) scale(.06) translateY(-110px);filter:blur(25px)}.launch .fly.a{animation:flyIn 1.9s cubic-bezier(.12,.82,.18,1) .35s forwards}.launch .fly.b{animation:flyIn 1.7s cubic-bezier(.12,.82,.18,1) 1.05s forwards}@keyframes flyIn{0%{opacity:0;transform:translateZ(-900px) scale(.06) translateY(-110px);filter:blur(25px)}25%{opacity:.7}78%{opacity:1;transform:translateZ(70px) scale(1.08) translateY(0);filter:blur(1px)}100%{opacity:1;transform:translateZ(0) scale(1) translateY(0);filter:blur(0)}}.impact{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff7c9;box-shadow:0 0 28px 12px #ffd66b,0 0 80px 36px #ffb52e88;opacity:0}.launch .impact{animation:impact 1.05s ease 2.25s forwards}@keyframes impact{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.6)}100%{opacity:0;transform:scale(13)}}.touch{position:absolute;z-index:9;left:50%;bottom:8%;transform:translateX(-50%);width:140px;height:140px;border-radius:50%;transition:.45s ease}.launch .touch{opacity:0;transform:translateX(-50%) scale(.78);pointer-events:none}.ring,.core{position:absolute;border-radius:50%}.ring{inset:0;border:2px solid #78f6d0;box-shadow:0 0 30px #78f6d0aa;animation:pulse 1.5s infinite}.core{inset:38px;background:radial-gradient(circle at 35% 30%,#e2fff7,#49ddb8 42%,#31d8ad33);box-shadow:0 0 35px #78f6d0}.gold .ring{border-color:#ffd66b;box-shadow:0 0 50px #ffd66bcc}.gold .core{background:radial-gradient(circle at 35% 30%,#fff,#ffe89b 35%,#ffb52e44);box-shadow:0 0 60px #ffd66b}@keyframes pulse{50%{transform:scale(1.1)}}.tt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#063b31;font-weight:900;font-size:14px}.cap{position:absolute;top:150px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;opacity:.65}.stars{position:absolute;inset:0;pointer-events:none;opacity:0;transition:.5s}.gold .stars{opacity:1}.stars b{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff2b0;box-shadow:0 0 18px 5px #ffd66b;animation:tw .8s infinite alternate}.stars b:nth-child(1){left:10%;top:20%}.stars b:nth-child(2){left:22%;top:65%}.stars b:nth-child(3){left:42%;top:18%}.stars b:nth-child(4){left:62%;top:72%}.stars b:nth-child(5){left:86%;top:26%}.stars b:nth-child(6){left:78%;top:52%}.stars b:nth-child(7){left:52%;top:38%}.stars b:nth-child(8){left:31%;top:49%}@keyframes tw{to{transform:scale(2.4);opacity:.25}}</style></head><body><div id="s" class="s"><div class="c"><div class="h"><div class="k">100개의 다짐 · 4개의 약속 · 하나의 내일</div><div class="r">박성민 청년특보</div><div class="o">대구광역시</div></div><div class="p"><i>내 꿈을 이루겠습니다</i><i>실패를 두려워하지 않겠습니다</i><i>배움을 멈추지 않겠습니다</i><i>나 자신을 믿고 도전하겠습니다</i><i>작은 실천이 큰 변화를 만듭니다</i><i>서로 응원하며 함께 성장하겠습니다</i><i>좋은 영향력을 나누겠습니다</i><i>오늘보다 한 걸음 나아가겠습니다</i></div><div class="mid"><div id="hero" class="hero old">청년과 함께</div><div class="cinematic"><span class="fly a">변화와</span><span class="fly b">성장</span><span class="impact"></span></div></div><div class="stars"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div><div id="touch" class="touch"><div class="ring"></div><div class="core"></div><div class="tt">TOUCH</div><div class="cap">터치해주세요</div></div></div></div><script>const s=document.getElementById('s'),h=document.getElementById('hero');h.classList.add('show');let done=0;function go(){if(done)return;done=1;s.classList.add('launch');setTimeout(()=>s.classList.add('gold'),650)}document.getElementById('touch').addEventListener('pointerup',e=>{e.stopPropagation();go()});</script></body></html>
