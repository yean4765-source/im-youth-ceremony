<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FINAL SPARK</title><style>:root{--mint:#00B7A8;--mint2:#77E4DA;--gold:#FFD166}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;background:#071312;color:#fff;overflow:hidden}body{background:radial-gradient(circle at 50% 50%,rgba(0,183,168,.16),transparent 31%),linear-gradient(135deg,#06100F,#0A1716 55%,#06100F)}.topbar{position:absolute;top:0;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid rgba(255,255,255,.08);z-index:20;background:rgba(7,19,18,.5)}.brand{font-size:20px;font-weight:900}.brand b{color:var(--mint2)}.mode{font-size:12px;color:#8FA4A1;letter-spacing:2px;font-weight:800}#app{height:100%;display:flex;align-items:center;justify-content:center;padding-top:84px;position:relative}.screen{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}.center{z-index:10;text-align:center;max-width:1000px;padding:24px}.kicker{color:var(--mint2);font-size:14px;letter-spacing:4px;font-weight:900;margin-bottom:14px}h1{font-size:58px;line-height:1.05;margin:0 0 14px;letter-spacing:-2.6px}.sub{font-size:20px;color:#B6C4C2;line-height:1.55}.sparkbtn{margin-top:34px;width:250px;height:250px;border-radius:50%;border:2px solid rgba(119,228,218,.55);background:radial-gradient(circle at 40% 35%,#26D9CA,#00B7A8 50%,#08796F 100%);color:#fff;font-size:24px;font-weight:950;cursor:pointer;box-shadow:0 0 0 18px rgba(0,183,168,.06),0 0 70px rgba(0,183,168,.38);touch-action:manipulation}.sparkbtn small{display:block;font-size:12px;letter-spacing:2.5px;margin-top:8px}.countdown{font-size:180px;font-weight:1000;color:var(--mint2);text-shadow:0 0 50px rgba(0,183,168,.55)}.scanTitle{font-size:18px;letter-spacing:3px;color:var(--mint2);font-weight:900;margin-bottom:20px}.slot{min-width:720px;max-width:90vw;padding:28px 42px;border-radius:24px;border:1px solid rgba(119,228,218,.25);background:rgba(255,255,255,.05);font-size:64px;font-weight:950}.winner{font-size:86px;font-weight:1000}.winnerLabel{font-size:15px;letter-spacing:4px;color:var(--gold);font-weight:950;margin-bottom:16px}.congrats{font-size:25px;color:#D5E5E2;margin-top:16px}.tagline{margin-top:24px;color:var(--mint2);font-weight:900;font-size:18px}.confetti{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden}.confetti i{position:absolute;width:9px;height:17px;animation:fall 3s linear forwards}@keyframes fall{from{transform:translateY(-70px) rotate(0)}to{transform:translateY(110vh) rotate(760deg)}}@media(max-width:800px){h1{font-size:40px}.sub{font-size:16px}.sparkbtn{width:205px;height:205px}.slot{min-width:0;font-size:43px}.winner{font-size:60px}}</style></head><body><div class="topbar"><div class="brand"><b>iM</b> 대한민국 청년 금융교육 프로젝트</div><div class="mode">FINAL CEREMONY · SPARK ON</div></div><div id="app"><div class="screen"><div class="center" id="content"></div><div class="confetti" id="confetti"></div></div></div><script>let names=[],running=false,winner=null;const SHARED_WINNER_KEY='im_youth_project_winners_v1';function getSharedWinners(){try{return JSON.parse(localStorage.getItem(SHARED_WINNER_KEY)||'[]')}catch(e){return[]}}function saveSharedWinner(n){const a=getSharedWinners();if(n&&!a.includes(n)){a.push(n);localStorage.setItem(SHARED_WINNER_KEY,JSON.stringify(a))}}function eligibleFrom(a){const used=new Set(getSharedWinners());return a.filter(n=>!used.has(n))}function secureRandomInt(max){if(window.crypto&&crypto.getRandomValues){const range=0x100000000,limit=range-(range%max),a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}return Math.floor(Math.random()*max)}function choice(a){return a[secureRandomInt(a.length)]}const EVENT_NAMES=["강민혁","고원","공현배","곽다연","구가현","권상미","김규리","김남건","김도영","김동민","김민서","김민석","김민섭","김민승","김민지","김병욱","김세현","김수연","김윤진","김은성","김정현","김주현","김한비","김현빈","남도형","남연진","류지성","민예지","박가은","박경연","박민정","박민준","박솔리","박순호","박정윤","박정은","박주완","박준형(0613)","박준형(4527)","박채은","백산","백송희","서광","석아현","소민주","손대한","손한솔","손효지","심명준","심태웅","우다경","원도윤","유승빈","이규렬","이나경","이도완","이동욱","이민지","이상역","이상일","이서한","이선호","이소원","이소진","이수광","이수빈","이시연","이시영","이연진","이영예","이재진","이재호","이종민","이종탁","이주은","이준호","이지선","이지수","이진수","임서하","장영훈","장우진","장지윤","전현준","정가영","정민교","정수민","조성민","조성빈","조연주","조예솔","조예은","조은우","조해민","조현준","최원석","하서준","홍인성","황성호","손유하"];names=EVENT_NAMES;function ready(){document.getElementById('content').innerHTML='<div class="kicker">FINAL SPARK</div><h1>청년의 가능성에<br>불을 밝혀주세요</h1><div class="sub">황병우 회장님의 한 번의 터치로<br>오늘의 <b>LUCKY SPARK</b>가 탄생합니다.</div><button class="sparkbtn" onclick="ignite()">SPARK ON<small>TOUCH TO IGNITE</small></button>'}function ignite(){if(running)return;const e=eligibleFrom(names);if(!e.length)return;running=true;countdown(3,e)}function countdown(n,e){if(n>0){document.getElementById('content').innerHTML='<div class="kicker">IGNITING</div><div class="countdown">'+n+'</div>';setTimeout(()=>countdown(n-1,e),850)}else scan(e)}function scan(e){const c=document.getElementById('content');let elapsed=0,interval=70,total=3100;function tick(){c.innerHTML='<div class="scanTitle">FINDING TODAY\'S LUCKY SPARK</div><div class="slot">'+choice(e)+'</div>';elapsed+=interval;if(elapsed<total){if(elapsed>1900)interval=115;if(elapsed>2500)interval=180;setTimeout(tick,interval)}else{winner=choice(e);saveSharedWinner(winner);reveal()}}tick()}function reveal(){document.getElementById('content').innerHTML='<div class="winnerLabel">TODAY\'S LUCKY SPARK</div><div class="winner">✨ '+winner+' ✨</div><div class="congrats">축하합니다!</div><div class="tagline">청년의 가능성에 가장 먼저 불을 밝히다</div>';const box=document.getElementById('confetti'),colors=['#00B7A8','#77E4DA','#FFD166','#FFFFFF','#4D96FF','#FF6B6B'];for(let i=0;i<120;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.top=(-40-Math.random()*120)+'px';x.style.background=colors[Math.floor(Math.random()*colors.length)];x.style.animationDelay=(Math.random()*.8)+'s';box.appendChild(x)}running=false}ready();</script></body></html>
