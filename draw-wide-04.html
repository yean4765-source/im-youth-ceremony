<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUCKY FRIEND · 가로형</title><style>:root{--mint:#00B7A8;--mint2:#79E5DA;--dark:#0F1720;--bg:#F4FAF9;--gold:#FFD166}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--dark);overflow:hidden;user-select:none;touch-action:manipulation}body{background:radial-gradient(circle at 15% 15%,rgba(0,183,168,.13),transparent 24%),radial-gradient(circle at 85% 85%,rgba(121,229,218,.18),transparent 30%),linear-gradient(135deg,#F7FCFB,#EEF7F5)}.topbar{position:absolute;top:0;left:0;right:0;height:82px;display:flex;justify-content:space-between;align-items:center;padding:0 42px;border-bottom:1px solid #DCE9E7;background:rgba(255,255,255,.88);z-index:20}.brand{font-size:22px;font-weight:950}.brand b{color:var(--mint)}.mode{font-size:13px;color:#7C8A88;letter-spacing:2px;font-weight:900}#app{height:100%;padding-top:82px;position:relative}.stage{height:100%;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.center{position:relative;z-index:10;text-align:center;max-width:1280px;padding:24px}.kicker{font-size:16px;color:var(--mint);font-weight:950;letter-spacing:5px;margin-bottom:16px}h1{margin:0;font-size:clamp(62px,6.7vw,108px);line-height:1.02;letter-spacing:-.055em}.sub{margin-top:20px;font-size:clamp(20px,1.8vw,28px);color:#687875;line-height:1.55}.pickbtn{margin-top:38px;border:0;border-radius:999px;padding:24px 50px;background:linear-gradient(135deg,var(--mint),#07998F);color:#fff;font-size:clamp(22px,2vw,31px);font-weight:950;box-shadow:0 14px 35px rgba(0,183,168,.25)}.heartbeat{width:230px;height:230px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 40% 35%,#34DCCF,#00B7A8 55%,#078277);color:#fff;font-size:42px;font-weight:1000;box-shadow:0 0 0 20px rgba(0,183,168,.06),0 0 80px rgba(0,183,168,.30);animation:beat .78s ease-in-out infinite alternate}@keyframes beat{from{transform:scale(.93)}to{transform:scale(1.05)}}.scan{min-width:820px;max-width:76vw;padding:34px 48px;border-radius:28px;background:#fff;border:1px solid #DCE9E7;box-shadow:0 18px 45px rgba(15,23,32,.08);font-size:clamp(64px,6vw,96px);font-weight:1000}.scanlabel{font-size:16px;letter-spacing:5px;color:var(--mint);font-weight:950;margin-bottom:22px}.winnerLabel{font-size:17px;color:var(--mint);font-weight:950;letter-spacing:5px;margin-bottom:20px}.winner{display:inline-block;padding:36px 62px;border-radius:32px;background:linear-gradient(135deg,#FFFFFF,#F3FFFD);border:3px solid var(--gold);font-size:clamp(92px,9vw,150px);font-weight:1000;box-shadow:0 22px 55px rgba(0,183,168,.16)}.congrats{font-size:29px;margin-top:20px;color:#425451}.tagline{font-size:22px;margin-top:16px;color:var(--mint);font-weight:950}.confetti{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden}.confetti i{position:absolute;width:9px;height:18px;animation:fall 3.1s linear forwards}@keyframes fall{from{transform:translateY(-70px) rotate(0)}to{transform:translateY(110vh) rotate(760deg)}}</style></head><body><div class="topbar"><div class="brand"><b>iM</b> 대한민국 청년 금융교육 프로젝트</div><div class="mode">YOUTH TO YOUTH · LUCKY FRIEND</div></div><div id="app"><div class="stage"><div class="center" id="content"></div><div class="confetti" id="confetti"></div></div></div><script>let names=[],running=false,winner=null;const SHARED_WINNER_KEY='im_youth_project_winners_v1';function getSharedWinners(){try{return JSON.parse(localStorage.getItem(SHARED_WINNER_KEY)||'[]')}catch(e){return[]}}function saveSharedWinner(n){const a=getSharedWinners();if(n&&!a.includes(n)){a.push(n);localStorage.setItem(SHARED_WINNER_KEY,JSON.stringify(a))}}function eligibleFrom(a){const used=new Set(getSharedWinners());return a.filter(n=>!used.has(n))}function rand(max){if(window.crypto&&crypto.getRandomValues){const range=0x100000000,limit=range-(range%max),a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}return Math.floor(Math.random()*max)}function choice(a){return a[rand(a.length)]}const EVENT_NAMES=["강민혁","고원","공현배","곽다연","구가현","권상미","김규리","김남건","김도영","김동민","김민서","김민석","김민섭","김민승","김민지","김병욱","김세현","김수연","김윤진","김은성","김정현","김주현","김한비","김현빈","남도형","남연진","류지성","민예지","박가은","박경연","박민정","박민준","박솔리","박순호","박정윤","박정은","박주완","박준형(0613)","박준형(4527)","박채은","백산","백송희","서광","석아현","소민주","손대한","손한솔","손효지","심명준","심태웅","우다경","원도윤","유승빈","이규렬","이나경","이도완","이동욱","이민지","이상역","이상일","이서한","이선호","이소원","이소진","이수광","이수빈","이시연","이시영","이연진","이영예","이재진","이재호","이종민","이종탁","이주은","이준호","이지선","이지수","이진수","임서하","장영훈","장우진","장지윤","전현준","정가영","정민교","정수민","조성민","조성빈","조연주","조예솔","조예은","조은우","조해민","조현준","최원석","하서준","홍인성","황성호","손유하"];names=EVENT_NAMES;function ready(){document.getElementById('content').innerHTML='<div class="kicker">LUCKY FRIEND</div><h1>친구야,<br>같이 가자!</h1><div class="sub">오늘의 행운을 혼자 가져가지 않습니다.<br>청년이 또 다른 청년에게 행운을 선물합니다.</div><button class="pickbtn" onclick="startPick()">PICK MY FRIEND<small style="display:block;font-size:12px;letter-spacing:2.2px;margin-top:6px">TOUCH TO SHARE LUCK</small></button>'}function startPick(){if(running)return;const e=eligibleFrom(names);if(!e.length)return;running=true;document.getElementById('content').innerHTML='<div class="kicker">CONNECTING</div><div class="heartbeat">🤝</div><div class="sub" style="margin-top:30px">청년들의 행운이 하나로 모이고 있습니다…</div>';setTimeout(()=>scan(e),1500)}function scan(e){const c=document.getElementById('content');let elapsed=0,interval=75,total=2600;function tick(){c.innerHTML='<div class="scanlabel">WHO WILL BE YOUR LUCKY FRIEND?</div><div class="scan">'+choice(e)+'</div>';elapsed+=interval;if(elapsed<total){if(elapsed>1600)interval=120;if(elapsed>2150)interval=190;setTimeout(tick,interval)}else{winner=choice(e);saveSharedWinner(winner);reveal()}}tick()}function reveal(){document.getElementById('content').innerHTML='<div style="font-size:64px;margin-bottom:8px">🤝</div><div class="winnerLabel">MY LUCKY FRIEND</div><div class="winner">'+winner+'</div><div class="congrats">친구가 생겼습니다! 축하합니다 🎉</div><div class="tagline">청년이 청년에게 전하는 오늘의 행운</div>';const box=document.getElementById('confetti'),colors=['#00B7A8','#79E5DA','#FFD166','#4D96FF','#FF6B6B','#7C5CFC'];for(let i=0;i<115;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.top=(-40-Math.random()*120)+'px';x.style.background=colors[Math.floor(Math.random()*colors.length)];x.style.animationDelay=(Math.random()*.7)+'s';box.appendChild(x)}running=false}ready();</script></body></html>
